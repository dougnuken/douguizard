<script type="text/markdown" id="guion">
# GUION · Hyperproof · Teleprompter de Doug

Idea central (la repites al inicio de cada caso, en cada resultado y en el cierre):
**"In complex products, the roles and the statuses are the product. I map them first, then I prove them with a working prototype."**

# Antes de empezar

- **Ritmo:** habla despacio, unas 130 palabras por minuto. Una idea por frase. Si sientes que corres, respira antes de cada conector (las líneas con →). Pasar rápido es peor que hacer una pausa.
- **Pausas:** cuenta "uno, dos" en silencio después de la idea central y después de cada cifra (15 roles, 45+ estados, 30 procesos). Deja que la diapositiva trabaje. Las dos pausas de preguntas son después de Naowee (14) y después de Occidente (21).
- **Si pierdes el hilo:** mira el título de la diapositiva, di la idea central en una frase y sigue con el conector. Frase de rescate: "Let me come back to the main idea." Si aún no sale, pulsa `P`/`O` y salta a la siguiente.
- **Si te interrumpen:** sonríe y responde ahí mismo, es buena señal. Luego regresa con "Back to the case." y retoma desde el último punto. Si vas tarde, corta en este orden: herramientas (32) → Occidente a 5 min (salta 18) → DC a 6 min (salta 28). Nunca cortes la 04 ni la 33.
- **Si no entiendes una pregunta:** no adivines. Di: "Sorry, can you say that again, more slowly?" o "Let me check I understand: you are asking about…". Si sigue difícil: "I want to answer well. Can you give me one example?" Responde corto y vuelve a la idea central.
- **Demo de DC (29):** ten las dos pestañas abiertas (editora y `?rol=lector`). Si falla, quédate en la diapositiva y cuéntalo en voz alta; no depures en la llamada. No entres al panel real.

---

## 01 · Cover · 0:00
CUE: Diapositiva de portada abierta. Sonríe, mira a la cámara, espera un segundo antes de hablar.
EN: Hello, and thank you for your time today. My name is Doug.
ES: Hola, y gracias por su tiempo hoy. Me llamo Doug.
EN: I will show you three products. Each one has many rules, a lot of data, and many roles.
ES: Les voy a mostrar tres productos. Cada uno tiene muchas reglas, muchos datos y muchos roles.
EN: I will talk about problems and decisions, not about pixels. Please stop me at any time. Questions are welcome.
ES: Voy a hablar de problemas y decisiones, no de píxeles. Por favor, interrúmpanme cuando quieran. Las preguntas son bienvenidas.
→ EN: First, a short hello.
→ ES: Primero, un saludo corto.

## 02 · Hello · 0:30
CUE: Avanza. Habla con calma; esta es tu presentación personal.
EN: I am Doug. I live in Barranquilla, on the Caribbean coast of Colombia.
ES: Soy Doug. Vivo en Barranquilla, en la costa Caribe de Colombia.
EN: I have twelve years in product design. My focus is complex products and design systems.
ES: Tengo doce años en diseño de producto. Mi enfoque son los productos complejos y los sistemas de diseño.
EN: Since 2018 I have worked mostly on products with strict rules: a bank, a government platform, a medical clinic.
ES: Desde 2018 he trabajado sobre todo en productos con reglas estrictas: un banco, una plataforma del gobierno, una clínica médica.
EN: I also write code, so I build my own prototypes. This will matter in a moment.
ES: También escribo código, así que construyo mis propios prototipos. Esto va a importar en un momento.
EN: [DOUG: one personal detail, for example what you enjoy outside work. Keep it to one short sentence.]
ES: [DOUG: un detalle personal, por ejemplo lo que disfrutas fuera del trabajo. Una sola frase corta.]
→ EN: Let me show you my path in one line.
→ ES: Les muestro mi camino en una línea.

## 03 · Career · 2:00
CUE: Señala la línea de tiempo con el cursor, de izquierda a derecha. Lee la cita de Qrvey solo si vas bien de tiempo.
EN: This is my path, from 2014 to today.
ES: Este es mi camino, de 2014 a hoy.
EN: I started with screens. At Qrvey I designed a data product. I worked with US teams at Ideaware and at Globant.
ES: Empecé con pantallas. En Qrvey diseñé un producto de datos. Trabajé con equipos de Estados Unidos en Ideaware y en Globant.
EN: From 2018 I moved to systems: five years at Banco de Occidente, then two years at Mercadolibre.
ES: Desde 2018 pasé a los sistemas: cinco años en Banco de Occidente y luego dos años en Mercadolibre.
EN: Today I am Head of Product at Naowee, a government platform.
ES: Hoy soy Head of Product en Naowee, una plataforma del gobierno.
EN: So the line goes from screens to systems. Keep that in mind, because the three cases follow it.
ES: Entonces la línea va de pantallas a sistemas. Tengan esto presente, porque los tres casos la siguen.
→ EN: Now, why did I choose these three cases for you?
→ ES: Ahora, ¿por qué escogí estos tres casos para ustedes?

## 04 · The thread · 3:30
CUE: Diapositiva clave, no la cortes. Señala la tabla fila por fila. Habla más lento. Esta es la diapositiva donde entregas la idea central por primera vez.
EN: Let me start with the reason. Your daily work is already in my work.
ES: Empiezo con la razón. Su trabajo diario ya está en mi trabajo.
EN: On the left, what you design at Hyperproof. On the right, what I designed.
ES: A la izquierda, lo que ustedes diseñan en Hyperproof. A la derecha, lo que yo diseñé.
EN: Evidence linked to a control. In Naowee, each document is checked against the exact article of the law it must meet.
ES: Evidencia vinculada a un control. En Naowee, cada documento se revisa contra el artículo exacto de la ley que debe cumplir.
EN: Control status and testing. In Naowee, every item is marked "meets the rule" or "not verified yet", with a deadline.
ES: Estado y pruebas de un control. En Naowee, cada ítem se marca "cumple la regla" o "aún no verificado", con una fecha límite.
EN: Roles and permissions. Naowee has 15 roles with approvals from the top down. DC Medical has access by area and action.
ES: Roles y permisos. Naowee tiene 15 roles con aprobaciones de arriba hacia abajo. DC Medical tiene acceso por área y acción.
EN: Steps that cannot be skipped. At DC, a treatment cannot start until it is paid and the consent is signed.
ES: Pasos que no se pueden saltar. En DC, un tratamiento no puede empezar hasta que esté pagado y el consentimiento firmado.
EN: And consistency across teams. At the bank, one design system was shared by more than 12 product teams.
ES: Y consistencia entre equipos. En el banco, un sistema de diseño lo compartían más de 12 equipos de producto.
EN: These products look different, but the problem is the same. People follow rules, and the system must show who can do what.
ES: Estos productos se ven distintos, pero el problema es el mismo. Las personas siguen reglas, y el sistema debe mostrar quién puede hacer qué.
EN: So here is the one idea I want you to keep. In complex products, the roles and the statuses are the product. I map them first, then I prove them with a working prototype.
ES: Esta es la idea que quiero que se lleven. En los productos complejos, los roles y los estados son el producto. Los mapeo primero y luego los pruebo con un prototipo funcional.
→ EN: Let me show you how I work, step by step.
→ ES: Les muestro cómo trabajo, paso a paso.

## 05 · How I work · 6:00
CUE: Recorre los cinco pasos con el cursor. En el paso 02 haz una pausa y repite la idea central con tus palabras.
EN: This is how I work, in five steps. First I map who does what. Then I design screens.
ES: Así trabajo, en cinco pasos. Primero mapeo quién hace qué. Luego diseño pantallas.
EN: Step one: I look at the real work. I ask for the files, emails and spreadsheets people use today. The exceptions are where design is hard. At Naowee, this was 30 processes in Word and email.
ES: Paso uno: miro el trabajo real. Pido los archivos, correos y hojas de cálculo que la gente usa hoy. Las excepciones son donde el diseño es difícil. En Naowee eran 30 procesos en Word y correo.
EN: Step two: I map roles and statuses, before any screen. At Naowee I mapped more than 45 statuses and 15 roles before I drew one screen.
ES: Paso dos: mapeo roles y estados, antes de cualquier pantalla. En Naowee mapeé más de 45 estados y 15 roles antes de dibujar una sola pantalla.
EN: Step three: a clickable prototype with real roles and real data. The team approves the prototype, not a document.
ES: Paso tres: un prototipo en el que se puede hacer clic, con roles y datos reales. El equipo aprueba el prototipo, no un documento.
EN: Step four: what repeats goes into the design system. We have more than 38 shared components.
ES: Paso cuatro: lo que se repite entra al sistema de diseño. Tenemos más de 38 componentes compartidos.
EN: Step five: I launch small, then I listen. At DC, the first version was view-only on day one.
ES: Paso cinco: lanzo algo pequeño y luego escucho. En DC, la primera versión era solo de lectura desde el primer día.
→ EN: Now, how does this work with other people? Let me talk about requirements and developers.
→ ES: Ahora, ¿cómo funciona esto con otras personas? Hablemos de requisitos y de desarrolladores.

## 06 · Requirements and developers · 8:30
CUE: Dos columnas: izquierda requisitos, derecha desarrolladores. Si vas tarde, resume cada columna en una frase.
EN: People agree faster on a prototype than on a document. That is my main point here.
ES: La gente se pone de acuerdo más rápido con un prototipo que con un documento. Ese es mi punto principal aquí.
EN: First, requirements. I start from what already exists: forms, files and emails show how the work really happens.
ES: Primero, los requisitos. Empiezo por lo que ya existe: los formularios, archivos y correos muestran cómo ocurre realmente el trabajo.
EN: I also challenge the plan early. At DC Medical I asked for a hard review of data, security and cost. The plan changed twice before I wrote any code.
ES: También cuestiono el plan temprano. En DC Medical pedí una revisión exigente de datos, seguridad y costo. El plan cambió dos veces antes de que yo escribiera código.
EN: And I like people to approve something that works. A document is read in many ways. A prototype shows the problems early, when they are cheap to fix.
ES: Y me gusta que la gente apruebe algo que funciona. Un documento se lee de muchas maneras. Un prototipo muestra los problemas temprano, cuando es barato arreglarlos.
EN: Now, developers. I give them a clear target: a working prototype built with real components, not a long spec.
ES: Ahora, los desarrolladores. Les doy un objetivo claro: un prototipo funcional construido con componentes reales, no una especificación larga.
EN: At Mercadolibre we agreed on one way to build each component for iOS, Android and web. At DC, the rules about money and dates are automated tests: 12 test suites.
ES: En Mercadolibre acordamos una sola forma de construir cada componente para iOS, Android y web. En DC, las reglas sobre dinero y fechas son pruebas automáticas: 12 suites de pruebas.
→ EN: So far you saw who I am and how I work. Next, the first case: the biggest rules problem I work on is in government. Let me show you Naowee.
→ ES: Hasta aquí vieron quién soy y cómo trabajo. Ahora, el primer caso: el problema de reglas más grande en el que trabajo está en el gobierno. Les muestro Naowee.

## 07 · Naowee SUID · 11:00
CUE: Diapositiva de apertura del caso 1. Pausa de un segundo. Di la idea central despacio: aquí es el primer callback fuerte.
EN: This is Naowee. It is my closest case to your product, so I will spend the most time here.
ES: Este es Naowee. Es el caso más cercano a su producto, por eso le dedicaré más tiempo.
EN: It is a government platform that manages Colombia's sports system: clubs, leagues, athletes, sports venues and public funding.
ES: Es una plataforma del gobierno que gestiona el sistema deportivo de Colombia: clubes, ligas, deportistas, escenarios deportivos y financiación pública.
EN: The users are government reviewers and coordinators, and the sports organizations they oversee. I am Head of Product, from 2026 to today. I work with business analysts, a designer I lead, and the developers.
ES: Los usuarios son revisores y coordinadores del gobierno, y las organizaciones deportivas que ellos supervisan. Soy Head of Product, de 2026 a hoy. Trabajo con analistas de negocio, una diseñadora o diseñador a quien lidero, y los desarrolladores.
EN: Look at the numbers. Thirty legal processes moved online, from Word and email. About 1,200 sports organizations. More than 130 screens, and more than 38 shared components.
ES: Miren los números. Treinta procesos legales pasaron a línea, desde Word y correo. Cerca de 1.200 organizaciones deportivas. Más de 130 pantallas y más de 38 componentes compartidos.
EN: Here is the big idea again. In a product like this, the roles and the statuses are the product. I mapped them first, then I proved them with a working prototype.
ES: Aquí está la idea central otra vez. En un producto así, los roles y los estados son el producto. Los mapeé primero y luego los probé con un prototipo funcional.
→ EN: Let me start with the problem.
→ ES: Empiezo con el problema.

## 08 · Naowee · The problem · 12:00
CUE: Muestra la imagen de la bandeja de asignación. Habla más lento en "there was no product".
EN: Here is the problem. The government must inspect about 1,200 sports organizations.
ES: Este es el problema. El gobierno debe inspeccionar cerca de 1.200 organizaciones deportivas.
EN: The law says how to do it, step by step.
ES: La ley dice cómo hacerlo, paso a paso.
EN: But before, all of it moved through Word files, emails and a shared folder. The process existed, but there was no product.
ES: Pero antes, todo se movía por archivos de Word, correos y una carpeta compartida. El proceso existía, pero no había producto.
EN: On the screen you see the new assignment inbox: what is in review, what is assigned, and what is being checked.
ES: En la pantalla ven la nueva bandeja de asignación: qué está en revisión, qué está asignado y qué se está verificando.
EN: I will show you four decisions. Each one is about a rule, a role or a status.
ES: Les mostraré cuatro decisiones. Cada una trata de una regla, un rol o un estado.
→ EN: The first decision came before any screen.
→ ES: La primera decisión llegó antes de cualquier pantalla.

## 09 · Naowee · Roles and statuses · 13:30
CUE: Señala la cadena de aprobación de arriba hacia abajo (Ministerio, comités, federaciones, ligas, clubes). Aquí está el corazón del caso: no corras.
EN: Decision one. First I mapped every status and every role.
ES: Decisión uno. Primero mapeé cada estado y cada rol.
EN: The pain was this. Nobody had written down who does what, or what status a request could be in. It lived in people's heads and in emails.
ES: El dolor era este. Nadie había escrito quién hace qué, ni en qué estado podía estar una solicitud. Vivía en la cabeza de la gente y en los correos.
EN: So what did we do? I mapped more than 45 statuses and 15 roles, before any screen.
ES: ¿Y qué hicimos? Mapeé más de 45 estados y 15 roles, antes de cualquier pantalla.
EN: I also modeled the real chain of approvals. Approvals go from the Ministry down to each club. An approved athlete belongs to a club, a league and a federation.
ES: También modelé la cadena real de aprobaciones. Las aprobaciones van desde el Ministerio hasta cada club. Un deportista aprobado pertenece a un club, una liga y una federación.
EN: The trade-off was clear. A simple list of athletes was faster to build. But the reports by league would be wrong, because the chain would not be real.
ES: El costo de la decisión era claro. Una lista simple de deportistas era más rápida de construir. Pero los reportes por liga serían incorrectos, porque la cadena no sería real.
EN: This connects to your work at Hyperproof because it is like a control's status and its owner. Together they decide what each person sees and can do.
ES: Esto se conecta con su trabajo en Hyperproof porque es como el estado de un control y su responsable. Juntos deciden qué ve y qué puede hacer cada persona.
EN: [DOUG: optional, one sentence about how the analysts or the team reacted when they first saw the map of statuses and roles. Only if it is true.]
ES: [DOUG: opcional, una frase sobre cómo reaccionaron los analistas o el equipo al ver por primera vez el mapa de estados y roles. Solo si es verdad.]
→ EN: With the roles and statuses clear, I could design the reviewer's screen.
→ ES: Con los roles y estados claros, pude diseñar la pantalla del revisor.

## 10 · Naowee · Evidence and rule · 15:30
CUE: Señala la fecha límite (18 días) y luego la lista de 7 documentos. Detente en un documento con su artículo de la ley. Esta es la diapositiva más cercana a "evidencia vinculada a un control".
EN: Decision two. Each document shows the rule it must meet.
ES: Decisión dos. Cada documento muestra la regla que debe cumplir.
EN: Here is the pain. A reviewer opened a file and had to remember which article of the law it should meet.
ES: Este es el dolor. Un revisor abría un archivo y tenía que recordar qué artículo de la ley debía cumplir.
EN: This is the reviewer's screen. The deadline is here: 18 days left. Next to it, a checklist of 7 documents.
ES: Esta es la pantalla del revisor. La fecha límite está aquí: quedan 18 días. A su lado, una lista de 7 documentos.
EN: Each document shows the article of the law it must meet. The reviewer approves, rejects, or adds a note to each one.
ES: Cada documento muestra el artículo de la ley que debe cumplir. El revisor aprueba, rechaza o agrega una nota a cada uno.
EN: The trade-off was that each row carries more information. But the rule and the proof are in one place.
ES: El costo es que cada fila lleva más información. Pero la regla y la prueba están en un solo lugar.
EN: Keep this in mind, because this is your world. For you, this is evidence linked to a control. The decision stays next to the rule.
ES: Tengan esto presente, porque este es su mundo. Para ustedes, esto es evidencia vinculada a un control. La decisión queda junto a la regla.
→ EN: But one document is not a full review. Let me show you what happens when a whole team reviews one project.
→ ES: Pero un documento no es una revisión completa. Les muestro qué pasa cuando todo un equipo revisa un proyecto.

## 11 · Naowee · Technical review · 17:00
CUE: Señala una marca "not verified yet" y luego la barra 4 de 6. Haz una pausa después de la frase sobre "not verified yet".
EN: Decision three. "Not verified yet" is a real answer.
ES: Decisión tres. "Aún no verificado" es una respuesta real.
EN: The pain was that eight technical teams review the same project. Nobody could see the progress, or what was missing.
ES: El dolor era que ocho equipos técnicos revisan el mismo proyecto. Nadie podía ver el avance ni lo que faltaba.
EN: So what did we do? Here, one technical team reviews one project. Every item has its rule and a mark: it meets the rule, or it is not verified yet.
ES: ¿Y qué hicimos? Aquí, un equipo técnico revisa un proyecto. Cada ítem tiene su regla y una marca: cumple la regla, o aún no está verificado.
EN: "Not verified yet" is not the same as "failed". The bar shows 4 of 6 done, under the team's deadline.
ES: "Aún no verificado" no es lo mismo que "falló". La barra muestra 4 de 6 hechos, bajo la fecha límite del equipo.
EN: The trade-off was that a third answer is harder to design than yes or no. But it stops people from approving what nobody checked.
ES: El costo es que una tercera respuesta es más difícil de diseñar que sí o no. Pero evita que la gente apruebe lo que nadie verificó.
EN: This connects to your work at Hyperproof because it is like control test results with a due date.
ES: Esto se conecta con su trabajo en Hyperproof porque es como los resultados de pruebas de un control con una fecha de vencimiento.
→ EN: Now, one more decision, this time for the person who assigns the work.
→ ES: Ahora, una decisión más, esta vez para la persona que asigna el trabajo.

## 12 · Naowee · Workload · 18:30
CUE: Haz la asignación en la captura o señala el contador que baja de 6 a 5. Di "from 6 to 5" despacio.
EN: Decision four. Show who is overloaded before you assign.
ES: Decisión cuatro. Mostrar quién está sobrecargado antes de asignar.
EN: The pain was that coordinators assigned late requests without knowing who already had too much work.

<script>
(function () {
  var src = document.getElementById("guion").textContent;
  var root = document.getElementById("script");
  var esc = function (s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
  var inline = function (s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<b>$1</b>"); };

  var blocks = [], cur = null, info = null, conn = null;
  src.split(/\r?\n/).forEach(function (raw) {
    var line = raw.trim();
    if (!line || line === "```" || /^-{3,}$/.test(line)) return;
    var m;
    if ((m = line.match(/^##\s+(\d+)\s*·\s*(.+?)(?:\s*·\s*(\d+:\d{2}))?\s*$/))) {
      info = null; conn = null;
      cur = document.createElement("section"); cur.className = "block";
      cur.dataset.n = m[1];
      cur.innerHTML = '<div class="head"><b>' + esc(m[1]) + '</b><span class="t">' + esc(m[2]) + '</span><span class="time">' + (m[3] || "") + "</span></div>";
      root.appendChild(cur); blocks.push(cur); return;
    }
    if ((m = line.match(/^#\s+(.+)$/))) {
      cur = null; conn = null;
      info = document.createElement("section"); info.className = "info";
      info.innerHTML = "<h2>" + inline(m[1]) + "</h2>";
      root.appendChild(info); return;
    }
    if (info) {
      if ((m = line.match(/^[-*]\s+(.+)$/))) {
        var ul = info.querySelector("ul") || info.appendChild(document.createElement("ul"));
        var li = document.createElement("li"); li.innerHTML = inline(m[1]); ul.appendChild(li);
      } else { var p = document.createElement("p"); p.innerHTML = inline(line); info.appendChild(p); }
      return;
    }
    if (!cur) return;
    if ((m = line.match(/^CUE:\s*(.+)$/i))) { var c = document.createElement("div"); c.className = "cue"; c.textContent = m[1]; cur.appendChild(c); return; }
    if ((m = line.match(/^→\s*EN:\s*(.+)$/))) { conn = document.createElement("div"); conn.className = "conn"; conn.innerHTML = '<p class="en">' + inline(m[1]) + "</p>"; cur.appendChild(conn); return; }
    if ((m = line.match(/^→\s*ES:\s*(.+)$/))) { (conn || cur).insertAdjacentHTML("beforeend", '<p class="es">' + inline(m[1]) + "</p>"); return; }
    if ((m = line.match(/^EN:\s*(.+)$/))) { cur.insertAdjacentHTML("beforeend", '<p class="en">' + inline(m[1]) + "</p>"); return; }
    if ((m = line.match(/^ES:\s*(.+)$/))) { cur.insertAdjacentHTML("beforeend", '<p class="es">' + inline(m[1]) + "</p>"); return; }
    cur.insertAdjacentHTML("beforeend", '<p class="es">' + inline(line) + "</p>");
  });

  var sc = document.getElementById("scroller"), jump = document.getElementById("jump");
  blocks.forEach(function (b, i) {
    var o = document.createElement("option"); o.value = i;
    o.textContent = b.dataset.n + " · " + b.querySelector(".t").textContent; jump.appendChild(o);
  });

  // Auto-scroll in pixels per second; speed steps feel even from slow reading to skimming.
  var SPEEDS = [12, 18, 26, 36, 48, 62, 80, 100], si = 2, playing = false, last = 0, acc = 0;
  function setSpeed(i) { si = Math.max(0, Math.min(SPEEDS.length - 1, i)); document.getElementById("speed").textContent = "Speed " + (si + 1); }
  function tick(t) {
    if (!playing) return;
    if (last) { acc += SPEEDS[si] * (t - last) / 1000; var whole = Math.floor(acc); if (whole) { sc.scrollTop += whole; acc -= whole; } }
    last = t; requestAnimationFrame(tick);
  }
  function play(on) {
    playing = on === undefined ? !playing : on; last = 0;
    var b = document.getElementById("play"); b.textContent = playing ? "❚❚ Pause" : "▶ Start"; b.classList.toggle("on", playing);
    if (playing) requestAnimationFrame(tick);
  }
  function current() {
    var y = window.innerHeight * .34, best = 0;
    blocks.forEach(function (b, i) { if (b.getBoundingClientRect().top <= y + 4) best = i; });
    return best;
  }
  function goTo(i) {
    i = Math.max(0, Math.min(blocks.length - 1, i));
    sc.scrollTop += blocks[i].getBoundingClientRect().top - window.innerHeight * .34 + 2;
  }
  sc.addEventListener("scroll", function () {
    var c = current();
    blocks.forEach(function (b, i) { b.classList.toggle("is-current", i === c); });
    if (+jump.value !== c) jump.value = c;
  }, { passive: true });

  var size = 44;
  function setSize(d) { size = Math.max(24, Math.min(72, size + d)); document.documentElement.style.setProperty("--size", size + "px"); }
  function toggleEs() { document.body.classList.toggle("no-es"); document.getElementById("toggle-es").classList.toggle("on", !document.body.classList.contains("no-es")); }

  document.getElementById("play").addEventListener("click", function () { play(); });
  document.getElementById("slower").addEventListener("click", function () { setSpeed(si - 1); });
  document.getElementById("faster").addEventListener("click", function () { setSpeed(si + 1); });
  document.getElementById("smaller").addEventListener("click", function () { setSize(-4); });
  document.getElementById("bigger").addEventListener("click", function () { setSize(4); });
  document.getElementById("toggle-es").addEventListener("click", toggleEs);
  jump.addEventListener("change", function () { goTo(+jump.value); });
  sc.addEventListener("wheel", function () { if (playing) play(false); }, { passive: true });
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey) return;
    if (e.key === " ") { e.preventDefault(); play(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setSpeed(si + 1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); setSpeed(si - 1); }
    else if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); goTo(current() + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goTo(current() - 1); }
    else if (e.key === "t" || e.key === "T") toggleEs();
  });
  if (blocks[0]) blocks[0].classList.add("is-current");
})();
</script>
