<title>Hyperproof Teleprompter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* A teleprompter: one dark, low-glare look on purpose, with a reading line a third of the way down. */
:root {
  --bg: #0d0e10;
  --panel: #16181b;
  --fg: #f4f3ef;
  --muted: #a4a29c;
  --dim: #6c6b67;
  --line: rgba(244, 243, 239, .12);
  --accent: #8b9bff;
  --cue: #f2b45c;
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --size: 44px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); -webkit-font-smoothing: antialiased; }
#scroller { height: 100%; overflow-y: auto; scroll-behavior: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#script { max-width: 980px; margin: 0 auto; padding-block: 34vh 70vh; }
#readline { position: fixed; left: 0; right: 0; top: 34vh; height: 0; border-top: 1px dashed rgba(139,155,255,.35); pointer-events: none; z-index: 2; }
#readline::before { content: "▶"; position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: -14px; color: var(--accent); font-size: 18px; }

.block { padding: 28px 0 36px; border-top: 1px solid var(--line); opacity: .45; transition: opacity 240ms ease; }
.block.is-current { opacity: 1; }
.head { display: flex; gap: 14px; align-items: baseline; font-family: var(--mono); font-size: 15px; color: var(--dim); margin-bottom: 18px; }
.head b { color: var(--accent); font-weight: 500; }
.head .t { color: var(--muted); }
.head .time { margin-left: auto; }
.cue { display: inline-block; font-family: var(--mono); font-size: 16px; color: var(--cue); border: 1px solid rgba(242,180,92,.35); border-radius: 10px; padding: 6px 10px; margin-bottom: 18px; }
.en { font-size: var(--size); line-height: 1.32; letter-spacing: -.012em; font-weight: 500; margin: 0 0 6px; text-wrap: pretty; }
.es { font-size: calc(var(--size) * .5); line-height: 1.45; color: var(--muted); margin: 0 0 22px; }
body.no-es .es { display: none; }
body.no-es .en { margin-bottom: 22px; }
.conn { margin-top: 10px; padding: 18px 22px; border-radius: 16px; background: rgba(139,155,255,.1); border: 1px solid rgba(139,155,255,.28); }
.conn .en { color: #dfe3ff; font-size: calc(var(--size) * .82); }
.conn .en::before { content: "→ "; color: var(--accent); }
.conn .es { margin-bottom: 0; }
.info { padding: 28px 0; border-top: 1px solid var(--line); }
.info h2 { font-size: 30px; letter-spacing: -.02em; margin: 0 0 14px; }
.info ul { margin: 0; padding-left: 22px; }
.info li, .info p { font-size: 22px; line-height: 1.5; color: var(--muted); margin: 0 0 10px; }
.info strong, .info b { color: var(--fg); }

#bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgba(13,14,16,.86); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line); font-family: var(--mono); font-size: 13px; color: var(--muted); }
#bar button, #bar select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; height: 34px; padding: 0 12px; cursor: pointer; }
#bar button:active { transform: scale(.96); }
#bar button:focus-visible, #bar select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#bar button.on { border-color: var(--accent); color: #dfe3ff; }
#bar .grow { flex: 1; }
#bar .keys { color: var(--dim); }
@media (max-width: 640px) { :root { --size: 30px; } #bar .keys { display: none; } }
@media (prefers-reduced-motion: reduce) { .block { transition: none; } }
</style>

<div id="readline" aria-hidden="true"></div>
<div id="scroller"><main id="script" aria-live="off"></main></div>
<div id="bar">
  <button id="play" title="Start or stop scrolling (space)">▶ Start</button>
  <button id="slower" title="Slower (↓)">−</button>
  <span id="speed">Speed 3</span>
  <button id="faster" title="Faster (↑)">+</button>
  <button id="smaller" title="Smaller text">A−</button>
  <button id="bigger" title="Bigger text">A+</button>
  <button id="toggle-es" class="on" title="Show or hide Spanish (T)">ES</button>
  <select id="jump" aria-label="Jump to slide"></select>
  <span class="grow"></span>
  <span class="keys">space play · ↑↓ speed · ←→ slide · T Spanish</span>
</div>

<script type="text/markdown" id="guion">
/*GUION*/
</script>
<script>
(function () {
  var src = document.getElementById("guion").textContent;
  var root = document.getElementById("script");
  var esc = function (s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
  var inline = function (s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<b>$1</b>"); };

  var blocks = [], cur = null, info = null, conn = null;
  src.split(/\r?\n/).forEach(function (raw) {
    var line = raw.trim();
    if (!line || line === "```" || /^-{3,}$/.test(line)) return;
    var m;
    if ((m = line.match(/^##\s+(\d+)\s*·\s*(.+?)(?:\s*·\s*(\d+:\d{2}))?\s*$/))) {
      info = null; conn = null;
      cur = document.createElement("section"); cur.className = "block";
      cur.dataset.n = m[1];
      cur.innerHTML = '<div class="head"><b>' + esc(m[1]) + '</b><span class="t">' + esc(m[2]) + '</span><span class="time">' + (m[3] || "") + "</span></div>";
      root.appendChild(cur); blocks.push(cur); return;
    }
    if ((m = line.match(/^#\s+(.+)$/))) {
      cur = null; conn = null;
      info = document.createElement("section"); info.className = "info";
      info.innerHTML = "<h2>" + inline(m[1]) + "</h2>";
      root.appendChild(info); return;
    }
    if (info) {
      if ((m = line.match(/^[-*]\s+(.+)$/))) {
        var ul = info.querySelector("ul") || info.appendChild(document.createElement("ul"));
        var li = document.createElement("li"); li.innerHTML = inline(m[1]); ul.appendChild(li);
      } else { var p = document.createElement("p"); p.innerHTML = inline(line); info.appendChild(p); }
      return;
    }
    if (!cur) return;
    if ((m = line.match(/^CUE:\s*(.+)$/i))) { var c = document.createElement("div"); c.className = "cue"; c.textContent = m[1]; cur.appendChild(c); return; }
    if ((m = line.match(/^→\s*EN:\s*(.+)$/))) { conn = document.createElement("div"); conn.className = "conn"; conn.innerHTML = '<p class="en">' + inline(m[1]) + "</p>"; cur.appendChild(conn); return; }
    if ((m = line.match(/^→\s*ES:\s*(.+)$/))) { (conn || cur).insertAdjacentHTML("beforeend", '<p class="es">' + inline(m[1]) + "</p>"); return; }
    if ((m = line.match(/^EN:\s*(.+)$/))) { cur.insertAdjacentHTML("beforeend", '<p class="en">' + inline(m[1]) + "</p>"); return; }
    if ((m = line.match(/^ES:\s*(.+)$/))) { cur.insertAdjacentHTML("beforeend", '<p class="es">' + inline(m[1]) + "</p>"); return; }
    cur.insertAdjacentHTML("beforeend", '<p class="es">' + inline(line) + "</p>");
  });

  var sc = document.getElementById("scroller"), jump = document.getElementById("jump");
  blocks.forEach(function (b, i) {
    var o = document.createElement("option"); o.value = i;
    o.textContent = b.dataset.n + " · " + b.querySelector(".t").textContent; jump.appendChild(o);
  });

  // Auto-scroll in pixels per second; speed steps feel even from slow reading to skimming.
  var SPEEDS = [12, 18, 26, 36, 48, 62, 80, 100], si = 2, playing = false, last = 0, acc = 0;
  function setSpeed(i) { si = Math.max(0, Math.min(SPEEDS.length - 1, i)); document.getElementById("speed").textContent = "Speed " + (si + 1); }
  function tick(t) {
    if (!playing) return;
    if (last) { acc += SPEEDS[si] * (t - last) / 1000; var whole = Math.floor(acc); if (whole) { sc.scrollTop += whole; acc -= whole; } }
    last = t; requestAnimationFrame(tick);
  }
  function play(on) {
    playing = on === undefined ? !playing : on; last = 0;
    var b = document.getElementById("play"); b.textContent = playing ? "❚❚ Pause" : "▶ Start"; b.classList.toggle("on", playing);
    if (playing) requestAnimationFrame(tick);
  }
  function current() {
    var y = window.innerHeight * .34, best = 0;
    blocks.forEach(function (b, i) { if (b.getBoundingClientRect().top <= y + 4) best = i; });
    return best;
  }
  function goTo(i) {
    i = Math.max(0, Math.min(blocks.length - 1, i));
    sc.scrollTop += blocks[i].getBoundingClientRect().top - window.innerHeight * .34 + 2;
  }
  sc.addEventListener("scroll", function () {
    var c = current();
    blocks.forEach(function (b, i) { b.classList.toggle("is-current", i === c); });
    if (+jump.value !== c) jump.value = c;
  }, { passive: true });

  var size = 44;
  function setSize(d) { size = Math.max(24, Math.min(72, size + d)); document.documentElement.style.setProperty("--size", size + "px"); }
  function toggleEs() { document.body.classList.toggle("no-es"); document.getElementById("toggle-es").classList.toggle("on", !document.body.classList.contains("no-es")); }

  document.getElementById("play").addEventListener("click", function () { play(); });
  document.getElementById("slower").addEventListener("click", function () { setSpeed(si - 1); });
  document.getElementById("faster").addEventListener("click", function () { setSpeed(si + 1); });
  document.getElementById("smaller").addEventListener("click", function () { setSize(-4); });
  document.getElementById("bigger").addEventListener("click", function () { setSize(4); });
  document.getElementById("toggle-es").addEventListener("click", toggleEs);
  jump.addEventListener("change", function () { goTo(+jump.value); });
  sc.addEventListener("wheel", function () { if (playing) play(false); }, { passive: true });
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey) return;
    if (e.key === " ") { e.preventDefault(); play(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setSpeed(si + 1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); setSpeed(si - 1); }
    else if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); goTo(current() + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goTo(current() - 1); }
    else if (e.key === "t" || e.key === "T") toggleEs();
  });
  if (blocks[0]) blocks[0].classList.add("is-current");
})();
</script>
